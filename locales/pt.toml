[memory_analysis]
help = "**O que faz**\nVaria o keyspace e classifica as chaves por memória estimada (e calor de acesso) para revelar chaves grandes.\n\n**Como ler os resultados**\n- **Size**: bytes estimados da chave (amostragem, não exato).\n- **Heat**: depende de `maxmemory-policy` — LFU mostra a frequência de acesso, LRU o tempo ocioso.\n\n**Notas**\nApenas comandos de leitura; `MEMORY USAGE` requer Redis 4.0+. Keyspaces grandes são amostrados, então os números são estimativas."
reco_panel_title = "Recomendações"
reco_healthy = "Nenhum problema encontrado — este espaço de chaves parece saudável."
reco_big_key_title = "Chave grande"
reco_big_key_detail = "Chaves grandes deixam mais lentos os comandos O(N), DEL, a replicação e a migração, e podem travar o loop de eventos. Divida-a em chaves menores ou faça sharding da coleção."
reco_unevictable_title = "As chaves não podem ser despejadas"
reco_unevictable_detail = "Com uma política volatile-*, apenas chaves com TTL podem ser despejadas. Com tantas chaves sem TTL, o servidor pode chegar a OOM sob pressão de memória. Defina TTLs ou mude para uma política allkeys-*."
reco_noeviction_title = "Sem política de despejo"
reco_noeviction_detail = "Com noeviction, as escritas começam a falhar assim que maxmemory é atingido. Se este banco for um cache, escolha allkeys-lru ou allkeys-lfu."
reco_fragmentation_title = "Alta fragmentação de memória"
reco_fragmentation_detail = "O alocador retém muito mais memória do que o conjunto de dados usa. Ative o activedefrag ou reinicie a instância durante uma janela de manutenção para recuperá-la."
reco_small_strings_title = "Muitas chaves string pequenas"
reco_small_strings_detail = "Um grande grupo de chaves string minúsculas desperdiça memória com a sobrecarga por chave. Agrupá-las em um único Hash pode reduzir bastante o uso de memória."
reco_dominant_prefix_title = "Um prefixo domina a memória"
reco_dominant_prefix_detail = "Um único prefixo de chave representa a maior parte da memória amostrada. Revise seu modelo de dados, os tamanhos dos valores e os TTLs — é o ponto de otimização de maior impacto."
