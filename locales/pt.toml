help = "**O que faz**\nVaria o keyspace e classifica as chaves por memória estimada (e calor de acesso) para revelar chaves grandes.\n\n**Como ler os resultados**\n- **Size**: bytes estimados da chave (amostragem, não exato).\n- **Heat**: depende de `maxmemory-policy` — LFU mostra a frequência de acesso, LRU o tempo ocioso.\n\n**Notas**\nApenas comandos de leitura; `MEMORY USAGE` requer Redis 4.0+. Keyspaces grandes são amostrados, então os números são estimativas."
