reco_unevictable_detail = "Avec une politique volatile-*, seules les clés ayant un TTL peuvent être évincées. Avec autant de clés sans TTL, le serveur peut atteindre l'OOM sous pression mémoire. Définissez des TTL ou passez à une politique allkeys-*."
