help = "**Rôle**\nParcourt le keyspace et classe les clés par mémoire estimée (et chaleur d'accès) pour repérer les grosses clés.\n\n**Lire les résultats**\n- **Size** : octets estimés de la clé (échantillon, non exact).\n- **Heat** : dépend de `maxmemory-policy` — LFU montre la fréquence d'accès, LRU le temps d'inactivité.\n\n**Remarques**\nCommandes en lecture seule ; `MEMORY USAGE` nécessite Redis 4.0+. Les grands keyspaces sont échantillonnés, les chiffres sont des estimations."
