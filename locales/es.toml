[memory_analysis]
help = "**Qué hace**\nRecorre el keyspace y clasifica las claves por memoria estimada (y calor de acceso) para detectar claves grandes.\n\n**Cómo leer los resultados**\n- **Size**: bytes estimados de esa clave (muestreo, no exacto).\n- **Heat**: depende de `maxmemory-policy` — LFU muestra la frecuencia de acceso, LRU el tiempo inactivo.\n\n**Notas**\nSolo comandos de lectura; `MEMORY USAGE` requiere Redis 4.0+. Los keyspaces grandes se muestrean, así que las cifras son estimaciones."
reco_panel_title = "Recomendaciones"
reco_healthy = "No se encontraron problemas: este espacio de claves parece saludable."
reco_big_key_title = "Clave grande"
reco_big_key_detail = "Las claves grandes ralentizan los comandos O(N), DEL, la replicación y la migración, y pueden bloquear el bucle de eventos. Divídela en claves más pequeñas o fragmenta la colección."
reco_unevictable_title = "Las claves no se pueden expulsar"
reco_unevictable_detail = "Con una política volatile-* solo se pueden expulsar las claves con TTL. Con tantas claves sin TTL, el servidor puede llegar a OOM bajo presión de memoria. Establece TTL o cambia a una política allkeys-*."
reco_noeviction_title = "Sin política de expulsión"
reco_noeviction_detail = "Con noeviction, las escrituras empiezan a fallar cuando se alcanza maxmemory. Si esta base de datos es una caché, elige allkeys-lru o allkeys-lfu en su lugar."
reco_fragmentation_title = "Fragmentación de memoria alta"
reco_fragmentation_detail = "El asignador retiene mucha más memoria de la que usa el conjunto de datos. Activa activedefrag o reinicia la instancia durante una ventana de mantenimiento para recuperarla."
reco_small_strings_title = "Muchas claves de cadena pequeñas"
reco_small_strings_detail = "Un gran grupo de claves de cadena diminutas desperdicia memoria en la sobrecarga por clave. Agruparlas en un único Hash puede reducir notablemente el uso de memoria."
reco_dominant_prefix_title = "Un prefijo domina la memoria"
reco_dominant_prefix_detail = "Un único prefijo de clave representa la mayor parte de la memoria muestreada. Revisa su modelo de datos, los tamaños de los valores y los TTL: es el punto de optimización de mayor impacto."
