reco_unevictable_detail = "Con una política volatile-* solo se pueden expulsar las claves con TTL. Con tantas claves sin TTL, el servidor puede llegar a OOM bajo presión de memoria. Establece TTL o cambia a una política allkeys-*."
reco_noeviction_title = "Sin política de expulsión"
reco_noeviction_detail = "Con noeviction, las escrituras empiezan a fallar cuando se alcanza maxmemory. Si esta base de datos es una caché, elige allkeys-lru o allkeys-lfu en su lugar."
reco_fragmentation_title = "Fragmentación de memoria alta"
