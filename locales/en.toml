reco_big_key_detail = "Big keys slow down O(N) commands, DEL, replication and migration, and can stall the event loop. Split it into smaller keys or shard the collection."
reco_unevictable_title = "Keys cannot be evicted"
reco_unevictable_detail = "Under a volatile-* policy only keys with a TTL can be evicted. With this many keys missing a TTL, the server can hit OOM under memory pressure. Set TTLs or switch to an allkeys-* policy."
reco_noeviction_title = "No eviction policy"
reco_noeviction_detail = "With noeviction, writes start failing once maxmemory is reached. If this database is a cache, choose allkeys-lru or allkeys-lfu instead."
reco_fragmentation_title = "High memory fragmentation"
