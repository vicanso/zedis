[advisories]
ignore = [
    # gtk3 pulled by tray-icon for Linux; we don't use tray on Linux
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",
    # proc-macro-error2 (unmaintained, informational — not a vulnerability).
    # Build-time-only proc-macro dep, never in the shipped binary. Pulled
    # transitively through pinned gpui / gpui-component git forks
    # (stacksafe-macro, and rust-embed -> include-flate-codegen) that we
    # can't swap out, and it has no newer/maintained release to update to.
    "RUSTSEC-2026-0173",

    # rsa "Marvin Attack" timing sidechannel — NO fixed version exists. Pulled
    # via russh / ssh-key for RSA SSH keys (SSH tunnels); the only way to drop
    # it is disabling russh's `rsa` feature, which removes RSA key support. The
    # attack requires a local attacker timing RSA decryption during the SSH
    # handshake, which is outside our threat model. Risk-accepted until russh
    # moves off the rsa RC. The bridge's MySQL store (sqlx's `mysql-rsa`, ADR
    # 18) reaches the same crate only to encrypt a password with the server's
    # public key — no private-key operation for the attack to time.
    "RUSTSEC-2023-0071",

    # Unmaintained (informational warnings, not vulnerabilities) — all deep
    # transitive deps from the pinned gpui / gpui-component / russh trees we
    # can't swap, none with a maintained drop-in replacement:
    "RUSTSEC-2024-0384", # instant         (gpui-component, notify-types)
    "RUSTSEC-2024-0436", # paste           (gpui-component, metal, ...)
    "RUSTSEC-2024-0370", # proc-macro-error (build-time-only proc-macro dep)
    "RUSTSEC-2025-0134", # rustls-pemfile  (rustls ecosystem)
    "RUSTSEC-2025-0141", # bincode         (gpui-component → syntect)
    "RUSTSEC-2026-0192", # ttf-parser      (gpui: fontdb <- usvg 0.46)
    # rustybuzz unmaintained (RUSTSEC-2026-0206). Only path:
    #   zedis → gpui (zed pin) → usvg 0.46 / resvg 0.46 → rustybuzz 0.20
    # Official replacement is `harfrust` via usvg/resvg >= 0.48, but that is
    # a 0.x semver-major bump for the SVG stack; our pinned gpui still requires
    # usvg = "0.46.0" and cargo will not unify 0.46→0.48. Drop both this and
    # RUSTSEC-2026-0192 once zed/gpui bumps resvg/usvg to >= 0.48 (which also
    # replaces ttf-parser with skrifa). Tracked in
    # https://github.com/vicanso/zedis/issues/115
    "RUSTSEC-2026-0206", # rustybuzz       (gpui: usvg 0.46 → rustybuzz)
    # zbus 5's split-out crates, unmaintained since zbus 6.0.0 (2026-10-16)
    # folded them back in as `zbus::names` / `zbus::wire`. Linux-only (D-Bus),
    # built through gpui-kit alone, not ours to move:
    #   gpui-kit → gpui-pre-linux / gpui-base → accesskit_unix (atspi), ashpd,
    #     oo7, notify-rust
    # Cargo.lock also lists keyring → zbus-secret-service-keyring-store →
    # secret-service, but zedis-connection takes keyring on macOS / Windows
    # only (Linux keeps the master key in a file), so that path never builds.
    # Every crate on the gpui path still requires zbus ^5 at its newest
    # release (checked 2026-10-18). Drop all three once it is on zbus >= 6.
    # Issues #227–#229.
    "RUSTSEC-2026-0370", # zvariant        (zbus 5)
    "RUSTSEC-2026-0371", # zbus_names      (zbus 5)
    "RUSTSEC-2026-0372", # zvariant_derive (zbus 5)

    # zstd 0.13.3 / zstd-safe 7.3.0, issues #244–#256. Reached only through
    # rust-embed's `compression` → include-flate 0.3.4, which pins zstd 0.13.
    # Our derives name no `#[compression]`, so the assets are deflated and
    # zstd is linked but never called; include-flate would only ever call
    # `Encoder::new` / `Decoder::new`, on files embedded at build time, and
    # none of these advisories is about those. Values the user stores are
    # decoded with ruzstd, and the bridge's zstd (tower-http) is already the
    # patched 0.14.3 / 8.2.0. include-flate's main is on zstd 0.14 but not
    # released (checked 2026-10-27): `cargo update` and drop these thirteen
    # once it is. `deny.toml` lists 0391, 0398 and 0403, the vulnerabilities;
    # the other ten are `unsound`, which cargo-deny does not report for a
    # transitive crate and cargo-audit does.
    "RUSTSEC-2026-0391", # zstd      — abandoned stream leaks into the next (#244)
    "RUSTSEC-2026-0395", # zstd-safe — StableInBuffer use-after-free (#247)
    "RUSTSEC-2026-0396", # zstd-safe — Seekable NULL / out-of-bounds seek table (#254)
    "RUSTSEC-2026-0397", # zstd-safe — OutBuffer::around_pos uninitialized memory (#248)
    "RUSTSEC-2026-0398", # zstd-safe — Seekable::decompress length past capacity (#245)
    "RUSTSEC-2026-0399", # zstd-safe — init_using_cdict / ddict use-after-free (#255)
    "RUSTSEC-2026-0400", # zstd-safe — dictionary after a one-shot call (#256)
    "RUSTSEC-2026-0401", # zstd-safe — train_from_buffer out-of-bounds read (#253)
    "RUSTSEC-2026-0402", # zstd-safe — CCtx::try_clone overflow, multithreaded (#252)
    "RUSTSEC-2026-0403", # zstd-safe — legacy frame streaming failure (#246)
    "RUSTSEC-2026-0404", # zstd-safe — DCtx::try_clone double free (#250)
    "RUSTSEC-2026-0405", # zstd-safe — out-of-range InBuffer::pos (#249)
    "RUSTSEC-2026-0406", # zstd-safe — multithreaded context, unfinished frame (#251)
]
