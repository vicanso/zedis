[package]
name = "zedis-gui"
version = "0.5.1"
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
categories = ["database"]
keywords = ["redis", "redis-manager", "gpui", "redis-client", "gui"]
description = "A blazing-fast, native Redis GUI built with Rust and GPUI."
license = "Apache-2.0"
homepage = "https://github.com/vicanso/zedis"
repository = "https://github.com/vicanso/zedis"
documentation = "https://github.com/vicanso/zedis"
exclude = [
    "CHANGELOG.md",
    "test/*",
    "assets/demo.gif",
    "assets/icon.png",
    "assets/zedis.png",
    "build-aux/*",
    "flatpak/*",
    "icons/*",
    "scripts/*",
    ".github",
]
readme = "./README.md"
build = "build.rs"
rust-version = "1.88.0"

[[bin]]
name = "zedis"
path = "src/main.rs"

[workspace]
members = ["crates/*", "zedis-cmd-builder"]

[dependencies]
aes-gcm = "0.11.0"
# Passphrase KDF for encrypted share tokens. Pinned to the exact prerelease
# already in the tree transitively (ssh-key), so promoting it to a direct
# dependency adds no binary weight.
argon2 = "0.6.0-rc.8"
ahash = "0.8.12"
anyhow = "1.0.102"
arc-swap = "1.9.1"
base64 = "0.22.1"
bitflags = "2.13.0"
bytes = "1.11.1"
chrono = "0.4.45"
dashmap = "6.2.1"
directories = "6.0.0"
flate2 = "1.1.9"
futures = "0.3.32"
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
gpui_macros = { workspace = true }
home = "0.5.12"
image = { version = "0.25", default-features = false, features = ["png"] }
humansize = "2.1.3"
humantime = "2.3.0"
infer = "0.19.0"
lz4_flex = { version = "0.13.1", default-features = false }
mimalloc = { version = "0.1.52", optional = true }
os_info = "3.15.0"
parking_lot = "0.12.5"
path-absolutize = "3.1.1"
percent-encoding = "2.3.2"
pretty-hex = "0.4.2"
prost-reflect = { version = "0.16.4", features = ["serde"] }
protox = "0.9.1"
rand = "0.10.1"
redb = "4.1.0"
redis = { version = "1.2.2", features = [
    "cluster",
    "cluster-async",
    "smol-comp",
    "smol-rustls-comp",
    "tls-rustls-insecure",
    "aio",
] }
# Provides the `ring` crypto backend for rustls 0.23+ (used transitively by redis TLS)
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
regex = "1.12.3"
rmp-serde = "1.3.1"
russh = { version = "0.61.2", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
rust-embed = { version = "8.11.0", default-features = false, features = [
    "compression",
] }
rust-i18n = "4.1.0"
ruzstd = "0.8.3"
schemars = "1.2.1"
semver = "1.0.28"
serde = "1.0.228"
sha2 = "0.11.0"
serde_json = "1.0.150"
serde_json_path = "0.7"
# Pinned to gpui-component's transitive version so the `CompletionProvider`
# trait's `lsp_types` types unify (used by the JSONPath autocomplete).
lsp-types = "=0.97.0"
smol = "2.0.2"
snafu = "0.9.1"
snap = "1.1.1"
substring = "1.4.5"
sys-locale = "0.3.2"
tempfile = "3.27.0"
time = "0.3.47"
# Single-language tree-sitter wiring for the Functions / EVAL editor.
# We deliberately avoid gpui-component's `tree-sitter-languages` feature
# (which pulls 30+ parsers) and instead register Lua at startup via the
# public `LanguageRegistry::register` API. Total cost ≈ one ~500KB
# parser instead of the bundle's 8-15MB.
tree-sitter = "0.26"
tree-sitter-lua = "0.4.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls-pki-types = { version = "1.14.1", features = ["std"] }
webpki-roots = "1.0.7"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
tracing-appender = "0.2.5"
url = "2.5.8"
uuid = "1.23.2"
zedis-ui = { path = "crates/zedis-ui" }
indexmap = { workspace = true }
simdutf8 = "0.1.5"
shlex = "2.0.1"
# Minimal blocking HTTP client for the OpenAI-compatible AI analysis
# request. `rustls` keeps parity with the rest of the TLS stack and
# avoids pulling a native (OpenSSL) dependency.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24.1"

[workspace.dependencies]
indexmap = "2.14.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
# gpui = "0.2.2"
# gpui-component = "0.5.1"
# gpui-component-assets = "0.5.1"
# gpui-macros = "0.2.2"

[build-dependencies]
winres = "0.1.12"
vergen = { version = "10", features = ["build"] }
vergen-git2 = "10"
toml = "0.9.10"

[package.metadata.cargo-machete]
ignored = ["gpui_macros", "rustls"]

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# Cold, one-shot decoder crates get size-optimized codegen: they run rarely
# (decoding an image value when one is viewed, parsing an SVG icon once before
# gpui caches it) or never (exr — pulled in by gpui's image features but no
# EXR ever reaches Zedis), so `opt-level = "s"` shrinks .text without touching
# any hot path. Rendering/shaping/network/proto crates deliberately stay at
# the default opt-level.
[profile.release.package.exr]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.qoi]
opt-level = "s"
[profile.release.package.tiff]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.zune-core]
opt-level = "s"
[profile.release.package.fdeflate]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"

[package.metadata.bundle]
name = "Zedis"
identifier = "com.bigtree.zedis"
icon = ["icons/zedis.icns"]
copyright = "Copyright © 2026 Tree xie. All rights reserved."
category = "public.app-category.developer-tools"
osx_minimum_system_version = "12.0"
short_description = "A high-performance Redis client written in Rust and GPUI."

[package.metadata.winres]
OriginalFilename = "zedis.exe"
LegalCopyright = "Copyright © 2026 Tree xie. All rights reserved."

[package.metadata.appimage]
assets = ["assets/zedis.desktop", "assets/icon.png"]
icon = "assets/icon.png"
desktop_entry = "assets/zedis.desktop"
