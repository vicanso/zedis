[package]
name = "zedis-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["redis", "wasm", "web"]
description = "The browser build of Zedis, talking to Redis through zedis-bridge."
# Not published: it ships as a bundle of wasm and JavaScript, not a crate.
publish = false

[lib]
# `cdylib` is what wasm-bindgen consumes; `rlib` keeps `cargo test` able to
# build the parts that are not browser-only.
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `tree-sitter`: gpui-component drops that dependency on wasm but still
# compiles the code behind the feature, so enabling it here is 37 errors.
gpui = { workspace = true }
gpui-kit = { workspace = true }
zedis-connection = { workspace = true }
zedis-core = { workspace = true }
zedis-ui = { workspace = true }

base64 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.104"
