# Flathub manifest for Zedis. See flatpak/README.md for how to (re)generate
# cargo-sources.json and test a local build before submitting to Flathub.
app-id: io.github.vicanso.zedis
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  # Flathub builds are network-isolated; the freedesktop SDK has no Rust
  # toolchain of its own.
  - org.freedesktop.Sdk.Extension.rust-stable
command: zedis
finish-args:
  # Redis connections
  - --share=network
  # GUI (Wayland with X11 fallback)
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration — required by GPUI
  - --device=dri
  # Connection metadata / preferences (zedis.toml, redis-servers.toml)
  - --filesystem=xdg-config/zedis:create
  # NOTE: SSH tunnels that authenticate with a key under ~/.ssh need read
  # access the sandbox does not grant by default; users can add it with
  # `flatpak override --user --filesystem=~/.ssh:ro io.github.vicanso.zedis`
  # (or Flatseal). Deliberately not requested here to keep the default
  # sandbox tight.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/zedis/cargo

modules:
  - name: zedis
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --features mimalloc
      - install -Dm755 target/release/zedis /app/bin/zedis
      - install -Dm644 flatpak/io.github.vicanso.zedis.desktop /app/share/applications/io.github.vicanso.zedis.desktop
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/io.github.vicanso.zedis.png
      # Scalable brand mark (Wayland compositors prefer SVG when available).
      - install -Dm644 icons/zedis-icon.svg /app/share/icons/hicolor/scalable/apps/io.github.vicanso.zedis.svg
      # Installed from the file source below (NOT the tag's checkout): the
      # metainfo — release entries included — is maintained alongside this
      # manifest, so a release-notes bump doesn't need a new upstream tag.
      - install -Dm644 io.github.vicanso.zedis.metainfo.xml /app/share/metainfo/io.github.vicanso.zedis.metainfo.xml
    sources:
      # Offline mirror of every crate in Cargo.lock (including git deps such
      # as GPUI) — regenerate with flatpak-cargo-generator, see README.md.
      - cargo-sources.json
      # AppStream metadata, shipped next to the manifest (see build-commands
      # note). Path is manifest-relative, so it resolves both in this repo
      # (flatpak/) and in the flathub repo (root).
      - type: file
        path: io.github.vicanso.zedis.metainfo.xml
      # Pinned release tag (submit-flathub.sh fills both fields).
      - type: git
        url: https://github.com/vicanso/zedis.git
        tag: v0.6.6
        commit: 6c0f626c190df5768742cccbdac03b963e51f5c9
