name: "Integration"
# Live tests for the connection layer against real servers
# (crates/zedis-connection/tests/live.rs), one job per server flavour.
# scripts/it/up.sh builds the same topology CI and a dev machine use:
# standalone + TLS + mTLS + sentinel + cluster from one image on the host
# network, plus an unprivileged sshd on the runner for the tunnel tests.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/zedis-connection/**"
      - "crates/zedis-core/**"
      - "scripts/it/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "crates/zedis-connection/**"
      - "crates/zedis-core/**"
      - "scripts/it/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest line still seen in the wild: no ACL DRYRUN, no FUNCTION,
          # no subcommand ACL rules — the fallbacks get exercised here.
          - name: redis-6.2
            image: redis:6.2
          - name: redis-7.2
            image: redis:7.2
          - name: redis-8.0
            image: redis:8.0
          - name: valkey-8
            image: valkey/valkey:8
            server_bin: valkey-server
            cli_bin: valkey-cli
            flavor: valkey
          # Valkey 9 is where the Valkey-only paths live: COMMANDLOG's size
          # logs (8.1) and atomic slot migration (9.0).
          - name: valkey-9
            image: valkey/valkey:9
            server_bin: valkey-server
            cli_bin: valkey-cli
            flavor: valkey
          # Modules (ReJSON / RediSearch) — the stack image's own entrypoint,
          # standalone only.
          - name: redis-stack
            image: redis/redis-stack-server:latest
            stack: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: integration
      - name: pull image
        run: docker pull ${{ matrix.image }}
      # The tunnel tests need an sshd on the runner itself — the Redis image
      # has none, and in docker mode the servers are on the host network, so
      # a tunnel opened here reaches them anyway. up.sh skips the scenario
      # (and the tests skip with it) when this is missing, which would lose
      # the coverage silently; install it rather than find out that way.
      - name: ensure sshd
        run: command -v sshd >/dev/null || sudo apt-get install -y -qq openssh-server
      - name: start topology
        env:
          REDIS_IMAGE: ${{ matrix.image }}
          SERVER_BIN: ${{ matrix.server_bin || 'redis-server' }}
          CLI_BIN: ${{ matrix.cli_bin || 'redis-cli' }}
          IT_STACK: ${{ matrix.stack || '0' }}
        run: scripts/it/up.sh
      # up.sh skips a scenario it cannot start (no sshd, an openssl whose
      # certificates rustls refuses) and the tests skip with it — green, and
      # the coverage quietly gone. Assert the two newest lanes really came
      # up, everywhere but the stack image, which runs standalone only.
      - name: assert the optional scenarios started
        if: matrix.stack != '1'
        run: |
          for var in ZEDIS_IT_MTLS ZEDIS_IT_SSH; do
            grep -q "^$var=" scripts/it/.env && continue
            echo "::error::$var is missing — up.sh skipped that scenario, so its tests did not run"
            tail -30 scripts/it/.run/sshd.log 2>/dev/null || true
            exit 1
          done
      - name: live tests
        env:
          ZEDIS_IT_FLAVOR: ${{ matrix.flavor || 'redis' }}
          RUST_BACKTRACE: "1"
        run: cargo test -p zedis-connection --test live -- --ignored --test-threads=4
      - name: server logs on failure
        if: failure()
        run: |
          for c in $(cat scripts/it/.run/containers 2>/dev/null); do
            echo "===== $c"; docker logs "$c" 2>&1 | tail -50
          done
          # sshd is a host process, so it has no container log.
          echo "===== sshd"; tail -50 scripts/it/.run/sshd.log 2>/dev/null || true
      - name: stop topology
        if: always()
        run: scripts/it/down.sh
