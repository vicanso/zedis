[package]
name = "zedis-connection"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["redis"]
description = "Redis connection layer for Zedis: pooled clients, server config, SSH tunnels."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = []
readme = "./README.md"
rust-version.workspace = true

[dependencies]
aes-gcm = { workspace = true }
arc-swap = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
indexmap = { workspace = true }
percent-encoding = { workspace = true }
# Jitter for the retry backoff, the master key, and the sampling ratio in the
# memory analysis — that last one runs in the browser too, which is why this
# is not native-only. The wasm block below asks `getrandom` for the page's
# crypto, which is what lets it build there at all.
rand = { workspace = true }
shlex = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zedis-core = { workspace = true }

# Dialing, and everything that exists only to dial: SSH, TLS, the async
# runtimes, the PKCS#8 reader for an encrypted client key, and the full redis
# client. A browser opens no sockets — its Redis traffic crosses the HTTP
# bridge instead (ADR 9) — and several of these have no wasm support at all
# (`tokio/net` reaches `mio`, `smol` reaches `polling`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
redis = { workspace = true }
pkcs8 = { workspace = true }
russh = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
smol = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

# In the browser redis is a codec and a set of traits and nothing more: `Cmd`
# packs a command, `parse_redis_value` reads a reply, `ConnectionLike` is what
# the bridge transport implements. No runtime, no TLS, no cluster routing —
# the bridge does all of that on the other side.
[target.'cfg(target_family = "wasm")'.dependencies]
redis = { version = "1.6.0", default-features = false, features = [
    # Same set redis enables by default, minus the runtimes: `num-bigint` in
    # particular keeps `Value::BigNumber` the same type on both targets, so
    # the reply formatter needs no cfg of its own.
    "num-bigint",
    "acl",
    "streams",
    "geospatial",
    "script",
] }
# Randomness. Neither of these is reached by name — they are here to turn on
# the browser backend of a transitive crate, which nothing else in this tree
# does: `uuid` mints v7 ids and `argon2` (the share-token KDF) pulls
# `getrandom`, and on wasm both refuse to build until the page's crypto is
# asked for by feature. Without them the crate only compiles when something
# *else* in the graph happens to enable it, which is how it silently worked
# through gpui-kit and would have broken the moment it was checked alone.
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Native OS keychain for the config-encryption key (macOS Keychain / Windows
# Credential Manager). Deliberately absent on Linux — there `master_key.rs`
# uses the 0600 key file instead of pulling the Secret Service / zbus stack.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { workspace = true }

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
