[package]
name = "zedis-connection"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["redis"]
description = "Redis connection layer for Zedis: pooled clients, server config, SSH tunnels."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = []
readme = "./README.md"
rust-version.workspace = true

[dependencies]
aes-gcm = { workspace = true }
arc-swap = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
indexmap = { workspace = true }
percent-encoding = { workspace = true }
pkcs8 = { workspace = true }
shlex = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
regex = { workspace = true }
russh = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true }
zedis-core = { path = "../zedis-core" }

# Native OS keychain for the config-encryption key (macOS Keychain / Windows
# Credential Manager). Deliberately absent on Linux — there `master_key.rs`
# uses the 0600 key file instead of pulling the Secret Service / zbus stack.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { workspace = true }

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
