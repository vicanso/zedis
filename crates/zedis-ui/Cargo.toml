[package]
name = "zedis-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["gui", "gpui"]
description = "Reusable GPUI widgets for Zedis: cards, dialogs, forms and a read-only text table."
license.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = []
readme = "./README.md"
rust-version.workspace = true

[dependencies]
gpui = { workspace = true }
gpui-kit = { workspace = true }
indexmap = { workspace = true }
zedis-core = { workspace = true }

[features]
# GPUI Fast in place of the default engine: see `gpui-fast` in the root
# manifest, which is the only thing that turns this on.
gpui-fast = ["gpui-kit/gpui-fast"]

[dev-dependencies]
# A table in a headless window (`text_table`'s column fit): the same
# test-support builds the app crate's UI tests use.
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
