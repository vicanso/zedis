[package]
name = "zedis-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["redis"]
description = "Local storage layer for Zedis: redb-backed managers and proto descriptors."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = []
readme = "./README.md"
rust-version.workspace = true

[dependencies]
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }

# The file half. redb is a file database, protox compiles `.proto` files off
# disk and the script viewer writes a temp file for the interpreter it spawns
# — none of which a browser tab has, so the web build drops those managers
# and stores its rows in `mem_store` instead (ADR 9).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
prost-reflect = { workspace = true }
protox = { workspace = true }
redb = { workspace = true }
# The script viewer's argument parsing.
regex = { workspace = true }
tempfile = { workspace = true }
# Only for `zedis_core::fs`: the config directory the database file lives in,
# and the path resolution the proto manager does. A browser tab reaches
# neither, so this crate does not need zedis-core there at all.
zedis-core = { workspace = true }

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
