[package]
name = "zedis-db"
version = "0.1.0"
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
categories = ["database"]
keywords = ["redis"]
description = "Local storage layer for Zedis: redb-backed managers and proto descriptors."
license = "Apache-2.0"
homepage = "https://github.com/vicanso/zedis"
repository = "https://github.com/vicanso/zedis"
documentation = "https://github.com/vicanso/zedis"
exclude = []
readme = "./README.md"
rust-version = "1.88.0"

[dependencies]
dashmap = { workspace = true }
prost-reflect = { workspace = true }
protox = { workspace = true }
redb = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
zedis-core = { path = "../zedis-core" }

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
