[package]
name = "zedis-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["redis"]
description = "Local storage layer for Zedis: redb-backed managers and proto descriptors."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = []
readme = "./README.md"
rust-version.workspace = true

[dependencies]
dashmap = { workspace = true }
# The proto viewers: a schema compiled and a value decoded by it. Both build
# for wasm32 — a page compiles a schema it was handed as text, in memory.
prost-reflect = { workspace = true }
protox = { workspace = true }
# A proto viewer's key pattern, and the script viewer's argument parsing.
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }
zedis-core = { workspace = true }

# The file half. redb is a file database, a proto schema can name a file on
# disk and the script viewer writes a temp file for the interpreter it spawns
# — none of which a browser tab has, so the web build drops what needs them
# and stores its rows in `mem_store` instead (ADR 9).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
redb = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
