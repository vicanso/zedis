[package]
name = "zedis-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["redis"]
description = "GUI-free core logic for Zedis (fuzzy match, hex/csv/diff, JSONPath, TTL helpers)."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = []
readme = "./README.md"
rust-version.workspace = true

[dependencies]
base64 = { workspace = true }
dashmap = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }

# The config-directory helpers (`fs`). A browser has no home directory and
# no filesystem to absolutize against, so the module and its dependencies are
# both absent there — `home` in particular has no wasm branch at all and fails
# to compile (ADR 9).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
directories = { workspace = true }
home = { workspace = true }
path-absolutize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "hot_paths"
harness = false

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
