[package]
name = "zedis-core"
version = "0.1.0"
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
categories = ["database"]
keywords = ["redis"]
description = "GUI-free core logic for Zedis (fuzzy match, hex/csv/diff, JSONPath, TTL helpers)."
license = "Apache-2.0"
homepage = "https://github.com/vicanso/zedis"
repository = "https://github.com/vicanso/zedis"
documentation = "https://github.com/vicanso/zedis"
exclude = []
readme = "./README.md"
rust-version = "1.88.0"

[dependencies]
dashmap = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }

[lints.clippy]
# Match the root crate: no unwrap anywhere, tests included.
unwrap_used = "deny"
