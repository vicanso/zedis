      .flow-a1-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-a1-2 6s linear infinite}
      .flow-a1-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-a1-3 6s linear infinite}
      .flow-a2-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-a2-0 6s linear infinite}
      .flow-a2-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-a2-1 6s linear infinite}
      .flow-a2-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-a2-2 6s linear infinite}
      .flow-a2-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-a2-3 6s linear infinite}
      .flow-ra-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-ra-0 6s linear infinite}
      .flow-ra-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-ra-1 6s linear infinite}
      .flow-ra-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-ra-2 6s linear infinite}
      .flow-ra-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-ra-3 6s linear infinite}
      .flow-b1-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-b1-0 6s linear infinite}
      .flow-b1-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-b1-1 6s linear infinite}
      .flow-b1-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-b1-2 6s linear infinite}
      .flow-b1-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-b1-3 6s linear infinite}
      .flow-b2-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-b2-0 6s linear infinite}
      .flow-b2-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-b2-1 6s linear infinite}
      .flow-b2-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-b2-2 6s linear infinite}
      .flow-b2-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-b2-3 6s linear infinite}
