      @keyframes flow-a2-3{0%,5.8%{stroke-dashoffset:28px}40.8%,100%{stroke-dashoffset:-308px}}
      @keyframes flow-ra-0{0%,33.3%{stroke-dashoffset:8px}49.2%,100%{stroke-dashoffset:-136px}}
      @keyframes flow-ra-1{0%,33.3%{stroke-dashoffset:88px}49.2%,100%{stroke-dashoffset:-56px}}
      @keyframes flow-ra-2{0%,33.3%{stroke-dashoffset:56px}49.2%,100%{stroke-dashoffset:-88px}}
      @keyframes flow-ra-3{0%,33.3%{stroke-dashoffset:28px}49.2%,100%{stroke-dashoffset:-116px}}
      @keyframes flow-b1-0{0%,43.3%{stroke-dashoffset:8px}56.7%,100%{stroke-dashoffset:-120px}}
      @keyframes flow-b1-1{0%,43.3%{stroke-dashoffset:88px}56.7%,100%{stroke-dashoffset:-40px}}
      @keyframes flow-b1-2{0%,43.3%{stroke-dashoffset:56px}56.7%,100%{stroke-dashoffset:-72px}}
      @keyframes flow-b1-3{0%,43.3%{stroke-dashoffset:28px}56.7%,100%{stroke-dashoffset:-100px}}
      @keyframes flow-b2-0{0%,49.2%{stroke-dashoffset:8px}67.5%,100%{stroke-dashoffset:-168px}}
