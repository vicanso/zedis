  <!-- Card -->
  <rect x="0.5" y="0.5" width="959" height="463" rx="16" fill="#0c0f14" stroke="rgba(255,255,255,0.08)"/>

  <!-- Header -->
  <text class="eyebrow" x="40" y="64">ARCHITECTURE</text>
  <text class="title" x="40" y="100">One codebase, native or in the browser</text>
  <text class="sub" x="40" y="416">zedis.net</text>

  <!-- Wires, then the tokens that travel along them, then the nodes on top -->
  <g aria-label="Paths from the shared UI, through the desktop app or the browser and the bridge, into the shared Redis layer and on to Redis">
      <path class="wire" d="M176,188 H208" marker-end="url(#zedis-architecture-arrow)"/>
      <path class="wire" d="M336,188 H576" marker-end="url(#zedis-architecture-arrow)"/>
