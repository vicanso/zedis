<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="zedis-architecture-title zedis-architecture-desc">
  <title id="zedis-architecture-title">One Zedis codebase, on the desktop and in the browser</title>
  <desc id="zedis-architecture-desc">Architecture diagram: the Zedis UI and the layer that connects to Redis are each one shared codebase; only what sits between them differs. The native desktop app calls the Redis layer in-process. In a browser tab the same UI runs as WebAssembly and calls zedis-bridge over an HTTP API; the bridge only turns those calls into Redis commands for the same layer. The layer talks RESP to standalone, Sentinel and Cluster deployments of Redis or Valkey.</desc>
  <defs>
    <marker id="zedis-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b98a8"/>
    </marker>
    <style>
      .name{font:600 16px Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;fill:#e8edf4}
      .hero{font:600 20px Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;fill:#e8edf4}
      .sub{font:400 12px 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;fill:#8b98a8}
      .label,.eyebrow,.zone,.tag{font:500 12px 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;fill:#8b98a8;letter-spacing:.06em}
      .eyebrow,.zone,.tag{letter-spacing:.14em}
      .tag{fill:#7aa8e8}
      .title{font:600 24px Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;fill:#e8edf4;letter-spacing:-.01em}
      .wire{fill:none;stroke:#8b98a8;stroke-width:1.5}
