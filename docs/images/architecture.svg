      @keyframes flow-a1-1{0%{stroke-dashoffset:88px}13.3%,100%{stroke-dashoffset:-40px}}
      @keyframes flow-a1-2{0%{stroke-dashoffset:56px}13.3%,100%{stroke-dashoffset:-72px}}
      @keyframes flow-a1-3{0%{stroke-dashoffset:28px}13.3%,100%{stroke-dashoffset:-100px}}
