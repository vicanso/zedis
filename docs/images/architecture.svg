      .flow-b3-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-b3-2 6s linear infinite}
      .flow-b3-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-b3-3 6s linear infinite}
      .flow-rb-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-rb-0 6s linear infinite}
      .flow-rb-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-rb-1 6s linear infinite}
