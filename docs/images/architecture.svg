      @keyframes flow-b2-2{0%,49.2%{stroke-dashoffset:56px}67.5%,100%{stroke-dashoffset:-120px}}
      @keyframes flow-b2-3{0%,49.2%{stroke-dashoffset:28px}67.5%,100%{stroke-dashoffset:-148px}}
      @keyframes flow-b3-0{0%,60%{stroke-dashoffset:8px}73.3%,100%{stroke-dashoffset:-120px}}
      @keyframes flow-b3-1{0%,60%{stroke-dashoffset:88px}73.3%,100%{stroke-dashoffset:-40px}}
      @keyframes flow-b3-2{0%,60%{stroke-dashoffset:56px}73.3%,100%{stroke-dashoffset:-72px}}
      @keyframes flow-b3-3{0%,60%{stroke-dashoffset:28px}73.3%,100%{stroke-dashoffset:-100px}}
      @keyframes flow-rb-0{0%,67.5%{stroke-dashoffset:8px}83.3%,100%{stroke-dashoffset:-136px}}
      @keyframes flow-rb-1{0%,67.5%{stroke-dashoffset:88px}83.3%,100%{stroke-dashoffset:-56px}}
      @keyframes flow-rb-2{0%,67.5%{stroke-dashoffset:56px}83.3%,100%{stroke-dashoffset:-88px}}
      @keyframes flow-rb-3{0%,67.5%{stroke-dashoffset:28px}83.3%,100%{stroke-dashoffset:-116px}}
      @media (prefers-reduced-motion: reduce){.token{display:none}}
      @media print{.token{display:none}}
    </style>
