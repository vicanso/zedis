      <path class="wire" d="M336,308 H416" marker-end="url(#zedis-architecture-arrow)"/>
      <rect x="340" y="284" width="72" height="16" rx="2" fill="#0c0f14"/>
      <text class="label" x="376" y="296" text-anchor="middle">HTTP API</text>
