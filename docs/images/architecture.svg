<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="zedis-architecture-title zedis-architecture-desc">
  <title id="zedis-architecture-title">One Zedis UI codebase, on the desktop and in the browser</title>
  <desc id="zedis-architecture-desc">Architecture diagram: one shared Zedis UI codebase is built two ways. As a native desktop app it talks RESP to Redis directly. As WebAssembly in a browser tab it calls zedis-bridge over an HTTP API, and the bridge talks RESP to Redis. Both paths reach standalone, Sentinel and Cluster deployments of Redis or Valkey.</desc>
  <defs>
    <marker id="zedis-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b98a8"/>
    </marker>
    <style>
      .name{font:600 16px Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;fill:#e8edf4}
      .hero{font:600 20px Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;fill:#e8edf4}
      .sub{font:400 12px 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;fill:#8b98a8}
      .label,.eyebrow,.zone,.tag{font:500 12px 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;fill:#8b98a8;letter-spacing:.06em}
      .eyebrow,.zone,.tag{letter-spacing:.14em}
      .tag{fill:#7aa8e8}
      .title{font:600 24px Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;fill:#e8edf4;letter-spacing:-.01em}
      .wire{fill:none;stroke:#8b98a8;stroke-width:1.5}
      .token path{fill:none;stroke-linecap:round}
      .tail{stroke:#4d8ff2;stroke-width:3}
      .head{stroke:#e3edff;stroke-width:5}
      .flow-a1-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-a1-0 6s linear infinite}
      .flow-a1-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-a1-1 6s linear infinite}
      .flow-a1-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-a1-2 6s linear infinite}
      .flow-a1-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-a1-3 6s linear infinite}
      .flow-a2-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-a2-0 6s linear infinite}
      .flow-a2-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-a2-1 6s linear infinite}
      .flow-a2-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-a2-2 6s linear infinite}
      .flow-a2-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-a2-3 6s linear infinite}
      .flow-b1-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-b1-0 6s linear infinite}
      .flow-b1-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-b1-1 6s linear infinite}
      .flow-b1-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-b1-2 6s linear infinite}
      .flow-b1-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-b1-3 6s linear infinite}
      .flow-b2-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-b2-0 6s linear infinite}
      .flow-b2-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-b2-1 6s linear infinite}
      .flow-b2-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-b2-2 6s linear infinite}
      .flow-b2-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-b2-3 6s linear infinite}
      .flow-b3-0{stroke-dasharray:0.1px 2000px;stroke-dashoffset:8px;animation:flow-b3-0 6s linear infinite}
      .flow-b3-1{stroke-dasharray:80px 2000px;stroke-dashoffset:88px;animation:flow-b3-1 6s linear infinite}
      .flow-b3-2{stroke-dasharray:48px 2000px;stroke-dashoffset:56px;animation:flow-b3-2 6s linear infinite}
      .flow-b3-3{stroke-dasharray:20px 2000px;stroke-dashoffset:28px;animation:flow-b3-3 6s linear infinite}
      @keyframes flow-a1-0{0%{stroke-dashoffset:8px}16%,100%{stroke-dashoffset:-144px}}
      @keyframes flow-a1-1{0%{stroke-dashoffset:88px}16%,100%{stroke-dashoffset:-64px}}
      @keyframes flow-a1-2{0%{stroke-dashoffset:56px}16%,100%{stroke-dashoffset:-96px}}
      @keyframes flow-a1-3{0%{stroke-dashoffset:28px}16%,100%{stroke-dashoffset:-124px}}
      @keyframes flow-a2-0{0%,9%{stroke-dashoffset:8px}51%,100%{stroke-dashoffset:-392px}}
      @keyframes flow-a2-1{0%,9%{stroke-dashoffset:88px}51%,100%{stroke-dashoffset:-312px}}
      @keyframes flow-a2-2{0%,9%{stroke-dashoffset:56px}51%,100%{stroke-dashoffset:-344px}}
      @keyframes flow-a2-3{0%,9%{stroke-dashoffset:28px}51%,100%{stroke-dashoffset:-372px}}
      @keyframes flow-b1-0{0%,43%{stroke-dashoffset:8px}59%,100%{stroke-dashoffset:-144px}}
      @keyframes flow-b1-1{0%,43%{stroke-dashoffset:88px}59%,100%{stroke-dashoffset:-64px}}
      @keyframes flow-b1-2{0%,43%{stroke-dashoffset:56px}59%,100%{stroke-dashoffset:-96px}}
      @keyframes flow-b1-3{0%,43%{stroke-dashoffset:28px}59%,100%{stroke-dashoffset:-124px}}
      @keyframes flow-b2-0{0%,53%{stroke-dashoffset:8px}72%,100%{stroke-dashoffset:-176px}}
      @keyframes flow-b2-1{0%,53%{stroke-dashoffset:88px}72%,100%{stroke-dashoffset:-96px}}
      @keyframes flow-b2-2{0%,53%{stroke-dashoffset:56px}72%,100%{stroke-dashoffset:-128px}}
      @keyframes flow-b2-3{0%,53%{stroke-dashoffset:28px}72%,100%{stroke-dashoffset:-156px}}
      @keyframes flow-b3-0{0%,65%{stroke-dashoffset:8px}82.5%,100%{stroke-dashoffset:-160px}}
      @keyframes flow-b3-1{0%,65%{stroke-dashoffset:88px}82.5%,100%{stroke-dashoffset:-80px}}
      @keyframes flow-b3-2{0%,65%{stroke-dashoffset:56px}82.5%,100%{stroke-dashoffset:-112px}}
      @keyframes flow-b3-3{0%,65%{stroke-dashoffset:28px}82.5%,100%{stroke-dashoffset:-140px}}
      @media (prefers-reduced-motion: reduce){.token{display:none}}
      @media print{.token{display:none}}
    </style>
  </defs>

  <!-- Card -->
  <rect x="0.5" y="0.5" width="959" height="463" rx="16" fill="#0c0f14" stroke="rgba(255,255,255,0.08)"/>

  <!-- Header -->
  <text class="eyebrow" x="48" y="64">ARCHITECTURE</text>
  <text class="title" x="48" y="100">One UI codebase, native or in the browser</text>
  <text class="sub" x="48" y="416">zedis.net</text>

  <!-- Zone: what it connects to -->
  <rect x="704" y="48" width="208" height="368" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.10)"/>
  <text class="zone" x="720" y="76">REDIS · VALKEY</text>

  <!-- Connectors, then the tokens that travel along them, then the nodes on top -->
  <g aria-label="Paths from the shared UI through the desktop app and the browser to Redis">
      <path class="wire" d="M200,188 H256" marker-end="url(#zedis-architecture-arrow)"/>
      <path class="wire" d="M400,188 H704" marker-end="url(#zedis-architecture-arrow)"/>
      <rect x="492" y="164" width="120" height="16" rx="2" fill="#0c0f14"/>
      <text class="label" x="552" y="176" text-anchor="middle">DIRECT · RESP</text>
      <path class="wire" d="M200,308 H256" marker-end="url(#zedis-architecture-arrow)"/>
      <path class="wire" d="M400,308 H488" marker-end="url(#zedis-architecture-arrow)"/>
      <rect x="408" y="284" width="72" height="16" rx="2" fill="#0c0f14"/>
      <text class="label" x="444" y="296" text-anchor="middle">HTTP API</text>
      <path class="wire" d="M632,308 H704" marker-end="url(#zedis-architecture-arrow)"/>
      <rect x="644" y="284" width="48" height="16" rx="2" fill="#0c0f14"/>
      <text class="label" x="668" y="296" text-anchor="middle">RESP</text>
  </g>
  <g>
      <g class="token" aria-hidden="true" focusable="false">
        <path class="tail flow-a1-1" d="M200,188 H256" opacity="0.2"/>
        <path class="tail flow-a1-2" d="M200,188 H256" opacity="0.45"/>
        <path class="tail flow-a1-3" d="M200,188 H256" opacity="0.9"/>
        <path class="head flow-a1-0" d="M200,188 H256"/>
      </g>
      <g class="token" aria-hidden="true" focusable="false">
        <path class="tail flow-a2-1" d="M400,188 H704" opacity="0.2"/>
        <path class="tail flow-a2-2" d="M400,188 H704" opacity="0.45"/>
        <path class="tail flow-a2-3" d="M400,188 H704" opacity="0.9"/>
        <path class="head flow-a2-0" d="M400,188 H704"/>
      </g>
      <g class="token" aria-hidden="true" focusable="false">
        <path class="tail flow-b1-1" d="M200,308 H256" opacity="0.2"/>
        <path class="tail flow-b1-2" d="M200,308 H256" opacity="0.45"/>
        <path class="tail flow-b1-3" d="M200,308 H256" opacity="0.9"/>
        <path class="head flow-b1-0" d="M200,308 H256"/>
      </g>
      <g class="token" aria-hidden="true" focusable="false">
        <path class="tail flow-b2-1" d="M400,308 H488" opacity="0.2"/>
        <path class="tail flow-b2-2" d="M400,308 H488" opacity="0.45"/>
        <path class="tail flow-b2-3" d="M400,308 H488" opacity="0.9"/>
        <path class="head flow-b2-0" d="M400,308 H488"/>
      </g>
      <g class="token" aria-hidden="true" focusable="false">
        <path class="tail flow-b3-1" d="M632,308 H704" opacity="0.2"/>
        <path class="tail flow-b3-2" d="M632,308 H704" opacity="0.45"/>
        <path class="tail flow-b3-3" d="M632,308 H704" opacity="0.9"/>
        <path class="head flow-b3-0" d="M632,308 H704"/>
      </g>
  </g>

  <g>
      <rect x="48" y="148" width="152" height="200" rx="8" fill="#0c0f14"/>
      <rect x="48" y="148" width="152" height="200" rx="8" fill="rgba(31,111,235,0.14)" stroke="#1f6feb" stroke-width="1.5"/>
      <text class="tag" x="124" y="216" text-anchor="middle">SHARED</text>
      <text class="hero" x="124" y="248" text-anchor="middle">Zedis UI</text>
      <text class="sub" x="124" y="272" text-anchor="middle">one codebase</text>
      <text class="sub" x="124" y="292" text-anchor="middle">Rust · GPUI</text>
      <rect x="256" y="148" width="144" height="80" rx="8" fill="#0c0f14"/>
      <rect x="256" y="148" width="144" height="80" rx="8" fill="#141a22" stroke="rgba(232,237,244,0.32)" stroke-width="1"/>
      <text class="name" x="328" y="180" text-anchor="middle">Desktop app</text>
      <text class="sub" x="328" y="204" text-anchor="middle">native binary</text>
      <rect x="256" y="268" width="144" height="80" rx="8" fill="#0c0f14"/>
      <rect x="256" y="268" width="144" height="80" rx="8" fill="#141a22" stroke="rgba(232,237,244,0.32)" stroke-width="1"/>
      <text class="name" x="328" y="300" text-anchor="middle">Browser tab</text>
      <text class="sub" x="328" y="324" text-anchor="middle">WebAssembly</text>
      <rect x="488" y="268" width="144" height="80" rx="8" fill="#0c0f14"/>
      <rect x="488" y="268" width="144" height="80" rx="8" fill="#141a22" stroke="rgba(232,237,244,0.32)" stroke-width="1"/>
      <text class="name" x="560" y="300" text-anchor="middle">zedis-bridge</text>
      <text class="sub" x="560" y="324" text-anchor="middle">accounts · audit</text>
      <rect x="720" y="96" width="176" height="64" rx="8" fill="#0c0f14"/>
      <rect x="720" y="96" width="176" height="64" rx="8" fill="rgba(232,237,244,0.05)" stroke="rgba(139,152,168,0.55)" stroke-width="1"/>
      <circle cx="752" cy="128" r="6" fill="#8b98a8"/>
      <text class="name" x="784" y="132">Standalone</text>
      <rect x="720" y="216" width="176" height="64" rx="8" fill="#0c0f14"/>
      <rect x="720" y="216" width="176" height="64" rx="8" fill="rgba(232,237,244,0.05)" stroke="rgba(139,152,168,0.55)" stroke-width="1"/>
      <path d="M744,248 L760,240 M744,248 L760,256" stroke="#8b98a8" stroke-width="1.2" fill="none"/><circle cx="744" cy="248" r="5" fill="#8b98a8"/><circle cx="760" cy="240" r="3.5" fill="#0c0f14" stroke="#8b98a8" stroke-width="1.2"/><circle cx="760" cy="256" r="3.5" fill="#0c0f14" stroke="#8b98a8" stroke-width="1.2"/>
      <text class="name" x="784" y="252">Sentinel</text>
      <rect x="720" y="336" width="176" height="64" rx="8" fill="#0c0f14"/>
      <rect x="720" y="336" width="176" height="64" rx="8" fill="rgba(232,237,244,0.05)" stroke="rgba(139,152,168,0.55)" stroke-width="1"/>
      <path d="M752,359 L761,375 L743,375 Z" stroke="#8b98a8" stroke-width="1.2" fill="none"/><circle cx="752" cy="359" r="4" fill="#8b98a8"/><circle cx="761" cy="375" r="4" fill="#8b98a8"/><circle cx="743" cy="375" r="4" fill="#8b98a8"/>
      <text class="name" x="784" y="372">Cluster</text>
  </g>
</svg>
